<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#080c16"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="busGrad1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#0ea5e9" stop-opacity=".2"/><stop offset="50%" stop-color="#6366f1" stop-opacity=".8"/><stop offset="100%" stop-color="#a855f7" stop-opacity=".2"/></linearGradient><linearGradient id="busGrad2" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".2"/><stop offset="50%" stop-color="#3b82f6" stop-opacity=".7"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".2"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes pulseGrid{0%{opacity:.12}50%{opacity:.28}}@keyframes packetFlow1{0%{transform:translateX(0);opacity:0}15%,85%{opacity:1}}@keyframes packetFlow2{0%{transform:translateX(1100px);opacity:0}15%,85%{opacity:1}}@keyframes nodePulse{0%{transform:scale(1);opacity:.7}50%{transform:scale(1.35);opacity:1}}@keyframes orbitFloat{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(180deg)}}.grid-layer{animation:pulseGrid 6s ease-in-out infinite}.node-pulse,.node-pulse-delayed{transform-origin:center;animation:nodePulse 3s ease-in-out infinite}.node-pulse-delayed{animation:nodePulse 3s ease-in-out infinite 1.5s}.packet-1{animation:packetFlow1 4.5s cubic-bezier(.4,0,.2,1) infinite}.packet-2{animation:packetFlow1 5.5s cubic-bezier(.4,0,.2,1) infinite 2s}.packet-3{animation:packetFlow2 5s cubic-bezier(.4,0,.2,1) infinite 1s}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><g stroke="#38bdf8" stroke-width=".75" class="grid-layer"><line x1="0" x2="1200" y1="60" y2="60" stroke-dasharray="4 8"/><line x1="0" x2="1200" y1="120" y2="120" stroke-dasharray="4 8"/><line x1="0" x2="1200" y1="180" y2="180" stroke-dasharray="4 8"/><line x1="0" x2="1200" y1="240" y2="240" stroke-dasharray="4 8"/><line x1="0" x2="1200" y1="300" y2="300" stroke-dasharray="4 8"/><line x1="150" x2="150" y1="0" y2="360" stroke-dasharray="4 8"/><line x1="350" x2="350" y1="0" y2="360" stroke-dasharray="4 8"/><line x1="600" x2="600" y1="0" y2="360" stroke-dasharray="4 8"/><line x1="850" x2="850" y1="0" y2="360" stroke-dasharray="4 8"/><line x1="1050" x2="1050" y1="0" y2="360" stroke-dasharray="4 8"/></g><g opacity=".65"><path fill="none" stroke="url(#busGrad1)" stroke-width="2.5" d="M 50 80 Q 300 40 600 80 T 1150 80"/><path fill="none" stroke="url(#busGrad2)" stroke-width="2.5" d="M 50 280 Q 300 320 600 280 T 1150 280"/></g><g filter="url(#glow)"><g class="packet-1"><circle cx="50" cy="80" r="5" fill="#38bdf8"/></g><g class="packet-2"><circle cx="50" cy="80" r="4" fill="#818cf8"/></g><g class="packet-3"><circle cx="50" cy="280" r="5" fill="#f43f5e"/></g></g><g><circle cx="90" cy="180" r="16" fill="#0369a1" class="node-pulse" opacity=".4"/><circle cx="90" cy="180" r="8" fill="#38bdf8" filter="url(#subtleGlow)"/><text x="90" y="210" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">PUBLISHERS</text><line x1="120" x2="220" y1="180" y2="180" stroke="#0ea5e9" stroke-dasharray="4 4" stroke-width="2" opacity=".6"/><circle cx="1110"