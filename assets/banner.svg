<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="busGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="busGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.28; }
      }
      @keyframes packetFlow1 {
        0% { transform: translateX(0px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(1100px); opacity: 0; }
      }
      @keyframes packetFlow2 {
        0% { transform: translateX(1100px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(0px); opacity: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.35); opacity: 1; }
      }
      @keyframes orbitFloat {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(180deg); }
        100% { transform: translateY(0px) rotate(360deg); }
      }
      .grid-layer {
        animation: pulseGrid 6s ease-in-out infinite;
      }
      .node-pulse {
        transform-origin: center;
        animation: nodePulse 3s ease-in-out infinite;
      }
      .node-pulse-delayed {
        transform-origin: center;
        animation: nodePulse 3s ease-in-out infinite 1.5s;
      }
      .packet-1 {
        animation: packetFlow1 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .packet-2 {
        animation: packetFlow1 5.5s cubic-bezier(0.4, 0, 0.2, 1) infinite 2s;
      }
      .packet-3 {
        animation: packetFlow2 5s cubic-bezier(0.4, 0, 0.2, 1) infinite 1s;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Animated Grid Pattern -->
  <g class="grid-layer" stroke="#38bdf8" stroke-width="0.75">
    <line x1="0" y1="60" x2="1200" y2="60" stroke-dasharray="4 8" />
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="4 8" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke-dasharray="4 8" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke-dasharray="4 8" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke-dasharray="4 8" />
    <line x1="150" y1="0" x2="150" y2="360" stroke-dasharray="4 8" />
    <line x1="350" y1="0" x2="350" y2="360" stroke-dasharray="4 8" />
    <line x1="600" y1="0" x2="600" y2="360" stroke-dasharray="4 8" />
    <line x1="850" y1="0" x2="850" y2="360" stroke-dasharray="4 8" />
    <line x1="1050" y1="0" x2="1050" y2="360" stroke-dasharray="4 8" />
  </g>

  <!-- Dynamic Event Bus Highway Lines (Background) -->
  <g opacity="0.65">
    <path d="M 50 80 Q 300 40 600 80 T 1150 80" fill="none" stroke="url(#busGrad1)" stroke-width="2.5" />
    <path d="M 50 280 Q 300 320 600 280 T 1150 280" fill="none" stroke="url(#busGrad2)" stroke-width="2.5" />
  </g>

  <!-- Flowing Dynamic Data Packets (Safe in Upper & Lower Tracks) -->
  <g filter="url(#glow)">
    <!-- Top Bus Packets -->
    <g class="packet-1">
      <circle cx="50" cy="80" r="5" fill="#38bdf8" />
    </g>
    <g class="packet-2">
      <circle cx="50" cy="80" r="4" fill="#818cf8" />
    </g>
    <!-- Bottom Bus Packets -->
    <g class="packet-3">
      <circle cx="50" cy="280" r="5" fill="#f43f5e" />
    </g>
  </g>

  <!-- Dynamic Pulsing Nodes -->
  <g>
    <!-- Left Pub Node -->
    <circle cx="90" cy="180" r="16" fill="#0369a1" opacity="0.4" class="node-pulse" />
    <circle cx="90" cy="180" r="8" fill="#38bdf8" filter="url(#subtleGlow)" />
    <text x="90" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#7dd3fc" font-weight="600" text-anchor="middle">PUBLISHERS</text>

    <!-- Connector lines -->
    <line x1="120" y1="180" x2="220" y2="180" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />

    <!-- Right Sub Node -->
    <circle cx="1110" cy="180" r="16" fill="#7e22ce" opacity="0.4" class="node-pulse-delayed" />
    <circle cx="1110" cy="180" r="8" fill="#c084fc" filter="url(#subtleGlow)" />
    <text x="1110" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#d8b4fe" font-weight="600" text-anchor="middle">SUBSCRIBERS</text>

    <!-- Connector lines -->
    <line x1="980" y1="180" x2="1080" y2="180" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
  </g>

  <!-- FOREGROUND CONTENT: Strictly Protected Layer -->
  <g id="foreground" text-anchor="middle">
    <!-- Top Category Tag -->
    <rect x="475" y="45" width="250" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="600" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8" font-weight="700" letter-spacing="1.5">⚡ EVENT STREAMING &amp; EDA</text>

    <!-- Main Title -->
    <text x="600" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" filter="url(#subtleGlow)" letter-spacing="-0.5">
      Awesome Event Bus &amp; Pub/Sub
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#94a3b8" font-weight="500">
      Enterprise Message Brokers, Event Streaming Platforms &amp; Real-Time Delivery Systems
    </text>

    <!-- Feature Pills / Tags in Foreground -->
    <g transform="translate(250, 222)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="150" height="34" rx="8" fill="#111827" stroke="#0284c7" stroke-width="1.2" />
      <text x="75" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8" font-weight="600">📡 Event Buses</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="165" height="34" rx="8" fill="#111827" stroke="#4f46e5" stroke-width="1.2" />
      <text x="257" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#a5b4fc" font-weight="600">🔄 Pub/Sub Brokers</text>

      <!-- Pill 3 -->
      <rect x="365" y="0" width="165" height="34" rx="8" fill="#111827" stroke="#7c3aed" stroke-width="1.2" />
      <text x="447" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#c084fc" font-weight="600">⚡ Event Streaming</text>

      <!-- Pill 4 -->
      <rect x="555" y="0" width="145" height="34" rx="8" fill="#111827" stroke="#db2777" stroke-width="1.2" />
      <text x="627" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f472b6" font-weight="600">🌐 Real-Time Web</text>
    </g>
  </g>
</svg>
